<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Comparar — Portafolio Yesid Carrillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #1c1c1c;
    --dot: #333;
    --panel: #2b2b2b;
    --panel-2: #383838;
    --ink: #f2f2f2;
    --mute: #9a9a9a;
    --sel: #0d99ff;
    --star: #ffc93c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--canvas); color: var(--ink); font-family: "Inter", system-ui, sans-serif; overscroll-behavior: none; }
  .mono { font-family: "JetBrains Mono", monospace; letter-spacing: .03em; }

  #vp { position: fixed; inset: 0; cursor: grab; touch-action: none; background-image: radial-gradient(var(--dot) 1.3px, transparent 1.5px); }
  #vp.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #world > * { position: absolute; }

  /* frame label like Figma */
  .flabel { position: absolute; top: -30px; left: 0; font-size: 18px; color: var(--mute); white-space: nowrap; display: flex; gap: 12px; align-items: center; }
  .flabel b { color: var(--ink); font-weight: 500; }

  /* concept header */
  .head { width: 1440px; height: 250px; border-radius: 20px; background: var(--panel); padding: 34px 40px; display: grid; grid-template-columns: auto 1fr auto; gap: 34px; align-items: start; }
  .head .num { font-size: 150px; font-weight: 800; line-height: .8; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 2px #5a5a5a; }
  .head h2 { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .head p { margin-top: 14px; font-size: 22px; line-height: 1.4; color: #cfcfcf; max-width: 760px; }
  .head .tags { display: flex; gap: 8px; margin-top: 16px; }
  .head .tags span { font-size: 15px; padding: 5px 12px; border-radius: 99px; background: var(--panel-2); color: var(--mute); }
  .head .acts { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .btn { font: 500 18px "Inter"; color: var(--ink); background: var(--panel-2); border: 1px solid #4a4a4a; border-radius: 12px; padding: 12px 18px; cursor: pointer; text-decoration: none; text-align: center; white-space: nowrap; transition: background .2s, border-color .2s; }
  .btn:hover { background: #444; }
  .btn.fav.on { background: var(--star); color: #1c1c1c; border-color: var(--star); }
  .head.picked { box-shadow: 0 0 0 4px var(--star); }

  /* device frames */
  .browser { width: 1440px; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 40px 80px -40px #000; outline: 0 solid var(--sel); transition: outline-width .15s; }
  .browser.live, .phone.live { outline-width: 4px; }
  .chrome { height: 48px; background: #2f2f2f; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .chrome i { width: 13px; height: 13px; border-radius: 50%; background: #555; }
  .chrome i:nth-child(1) { background: #ff5f57; } .chrome i:nth-child(2) { background: #febc2e; } .chrome i:nth-child(3) { background: #28c840; }
  .chrome .url { flex: 1; margin: 0 14px; height: 30px; border-radius: 8px; background: #1f1f1f; color: var(--mute); font-size: 14px; display: flex; align-items: center; padding: 0 14px; }
  .chrome button { font: 500 14px "Inter"; color: var(--ink); background: #444; border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .chrome button.on { background: var(--sel); }
  .browser iframe { display: block; width: 1440px; height: 900px; border: 0; pointer-events: none; background: #fff; }
  .live iframe { pointer-events: auto; }

  .phone { width: 420px; padding: 15px; border-radius: 62px; background: #0d0d0d; box-shadow: inset 0 0 0 2px #3a3a3a, 0 40px 80px -40px #000; outline: 0 solid var(--sel); transition: outline-width .15s; }
  .phone .screen { position: relative; width: 390px; height: 844px; border-radius: 48px; overflow: hidden; background: #fff; }
  .phone iframe { width: 390px; height: 844px; border: 0; pointer-events: none; display: block; }
  .phone .island { position: absolute; top: 12px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; z-index: 2; pointer-events: none; }
  .phone-bar { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .phone-bar button { font: 500 14px "Inter"; color: var(--ink); background: #444; border: none; border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  .phone-bar button.on { background: var(--sel); }

  /* inspiration */
  .insp { width: 990px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px 30px; }
  .insp a { display: block; color: inherit; text-decoration: none; }
  .insp img { width: 100%; aspect-ratio: 1920/1325; object-fit: cover; object-position: top; border-radius: 10px; display: block; background: var(--panel); transition: transform .3s; pointer-events: none; }
  .insp a:hover img { transform: scale(1.02); }
  .insp .cap { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 18px; }
  .insp .cap b { font-weight: 600; }
  .insp .cap span { color: var(--mute); text-align: right; }
  .insp .ref { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; aspect-ratio: 1920/1325; padding: 26px; border-radius: 10px; background: var(--panel); border: 1px solid #3f3f3f; transition: background .3s, transform .3s; }
  .insp .ref:hover { background: var(--panel-2); transform: scale(1.02); }
  .insp .ref .initial { font-size: 120px; font-weight: 800; line-height: .8; letter-spacing: -.06em; color: transparent; -webkit-text-stroke: 2px #6a6a6a; }
  .insp .ref .cap { margin-top: 0; flex-direction: column; gap: 6px; }
  .insp .ref .cap span { text-align: left; }
  .insp .ref i { font-style: normal; font-size: 15px; color: var(--mute); }
  .insp-title { font-size: 26px; font-weight: 600; color: var(--mute); }
  .insp-title em { font-style: normal; color: var(--ink); }

  /* chrome UI */
  .top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 10; }
  .top > * { pointer-events: auto; background: var(--panel); border-radius: 12px; padding: 10px 14px; font-size: 13px; box-shadow: 0 10px 30px -14px #000; display: flex; gap: 10px; align-items: center; }
  .top a { color: var(--ink); }
  #favLabel { color: var(--star); }
  .toolbar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; background: var(--panel); border-radius: 14px; z-index: 10; box-shadow: 0 16px 40px -16px #000; max-width: calc(100vw - 24px); overflow-x: auto; }
  .toolbar button { background: none; border: none; color: var(--ink); font: 500 13px "Inter"; padding: 9px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .toolbar button:hover, .toolbar button.on { background: #ffffff1a; }
  .toolbar .sep { width: 1px; background: #ffffff22; margin: 6px 2px; flex: none; }
  #zl { min-width: 52px; }
  .help { position: fixed; left: 14px; bottom: 18px; font-size: 12px; color: var(--mute); z-index: 10; line-height: 1.6; }
  .top > * { white-space: nowrap; }
  @media (max-width: 1100px) { .help, .top .sub { display: none; } }
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>

<div class="top">
  <div><a href="/" style="text-decoration:none">← Volver al sitio</a> <span style="color:var(--mute)">/</span> <b>Comparar direcciones</b> <span class="sub" style="color:var(--mute)">· 4 conceptos en vivo</span></div>
  <div><span id="favLabel">Sin favorito aún</span><a href="/laboratorio">Vista galería ↗</a></div>
</div>

<nav class="toolbar" id="toolbar">
  <button data-fit="all" class="on">Ver todo</button>
  <span class="sep"></span>
  <button data-fit="0">01 Señal</button>
  <button data-fit="1">02 Índice</button>
  <button data-fit="2">03 Pestañas</button>
  <button data-fit="3">04 Lienzo</button>
  <span class="sep"></span>
  <button data-fit="row-desk">Fila escritorio</button>
  <button data-fit="row-mob">Fila móvil + inspiración</button>
  <span class="sep"></span>
  <button id="zo" aria-label="Alejar">−</button>
  <button id="zl">100%</button>
  <button id="zi" aria-label="Acercar">+</button>
</nav>
<div class="help">Arrastra para moverte · Ctrl/⌘ + rueda o pellizco para zoom · “Interactuar” para usar un diseño · Esc para salir</div>

<script>
const M = id => 'https://mobbin.com/sites/sections/' + id;
const concepts = [
  {
    name: 'Señal', path: '/laboratorio/senal', tags: ['Oscuro', 'Cinematográfico', 'Tech'],
    desc: 'Precarga con contador, nombre con glitch RGB sobre esfera de partículas reactiva y galería horizontal anclada al scroll.',
    insp: [['01-unseen', 'Unseen Studio', 'Glitch + globo wireframe', '64611226-7921-4e34-9001-83c7e91bd803'], ['01-squarespace', 'Squarespace', 'Esfera de partículas', 'c89f9f86-b4f8-4d83-ae11-71ba2fb6f5f3'], ['01-grok', 'Grok', 'Destello cálido + tipo gigante', '6d1d2671-6a8f-4bd9-868d-0f03dab5e519'], ['01-basement', 'basement.studio', 'Estética oscura técnica', '28a88d90-f813-478b-bb89-336dbe1e48a0']],
  },
  {
    name: 'Índice', path: '/laboratorio/indice', tags: ['Claro', 'Editorial', 'Suizo'],
    desc: 'Alma de revista: nombre entre grotesca pesada y serif, lista de obras tipo cartelera con vista previa que sigue al cursor.',
    insp: [['02-freshman', 'Freshman', 'Sans pesada + serif', 'cc46fe95-d2fb-46a6-927a-96c9bc6d5ecc'], ['02-a24', 'A24', 'Lista de títulos enormes', 'b645a881-adf5-43f3-a86c-758cd54f0b72'], ['02-locomotive', 'Locomotive', 'Índice tabular', '280c1a2d-41d4-4495-a4bd-816763c93ad3'], ['02-niteriot', 'Nite Riot', 'Metadatos mono + reloj', '1aa05a05-6920-4f35-a581-3dcf42634162']],
  },
  {
    name: 'Pestañas', path: '/laboratorio/pestanas', tags: ['Color', 'App-like', 'Lúdico'],
    desc: 'Sistema operativo de colores: pestañas que se expanden, transición de tinta circular desde el clic, una sección por pantalla.',
    insp: [['03-rawmaterials', 'Raw Materials', 'Pestañas de color numeradas', 'e5ec35b6-1d56-4131-a532-b8390ff5373d'], ['03-wild', 'Wild', 'Texto pixelado de colores', 'b7197fb0-f4c9-4583-8864-d0f5e1c94195'], ['03-cloudstudio', 'Cloudstudio', 'Grid de trabajo', '48890788-7d16-4887-baaa-5b22583ef055'], ['03-unseen-filtros', 'Unseen Studio', 'Filtros en píldoras', '79d328bc-800b-4830-9de1-7ef8fd2dd00f']],
  },
  {
    name: 'Lienzo', path: '/laboratorio/lienzo', tags: ['Infinito', 'Interactivo', 'Juguetón'],
    desc: 'Portafolio como lienzo infinito tipo Figma: arrastrar, hacer zoom, mover stickers con ojos y un “reclutador” fantasma.',
    insp: [['04-superr', 'Superr', 'Cuadernos con etiquetas a mano', '7503f85b-2854-46df-a1bc-db51a8223469'], ['04-offbrand', 'OFF+BRAND', 'Orbe + tarjetas flotantes', 'f890a5d7-f914-4f60-8ec2-a15350081db4'], ['04-mana', 'MANA Yerba Maté', 'Personaje “press space”', '1bdcc550-68a0-4c2b-b010-473839dbf7bc'], ['04-touchy', 'Touchy Coffee', 'Trazos a mano alzada', '1262461a-ee8b-472e-9cf1-001b0de70548']],
  },
];

/* ---------- Layout (world coords) ---------- */
const COL = 1640, Y_HEAD = 0, Y_DESK = 340, Y_LOW = 1400;
const world = document.getElementById('world'), vp = document.getElementById('vp');
const add = (html, x, y) => { const d = document.createElement('div'); d.style.left = x + 'px'; d.style.top = y + 'px'; d.innerHTML = html; world.appendChild(d); return d; };
let fav = null;
try { fav = localStorage.getItem('portafolio-fav'); } catch (e) {}

concepts.forEach((c, i) => {
  const x = i * COL, n = String(i + 1).padStart(2, '0');
  add(`<div class="flabel"><b>${n} — ${c.name}</b></div>
    <div class="head" data-i="${i}"><div class="num">${n}</div>
      <div><h2>${c.name}</h2><p>${c.desc}</p><div class="tags">${c.tags.map(t => `<span>${t}</span>`).join('')}</div></div>
      <div class="acts"><button class="btn fav" data-fav="${i}">☆ Me gusta este</button><a class="btn" href="${c.path}" target="_blank" rel="noopener">Abrir ↗</a></div>
    </div>`, x, Y_HEAD);
  add(`<div class="flabel">Escritorio · 1440 × 900</div>
    <div class="browser" data-frame><div class="chrome"><i></i><i></i><i></i><div class="url mono">yesidcarrillo.dev — ${c.name.toLowerCase()}</div><button data-reload>↻ Reiniciar</button><button data-live>▶ Interactuar</button></div>
    <iframe src="${c.path}" title="${c.name} escritorio" loading="lazy" tabindex="-1"></iframe></div>`, x, Y_DESK);
  add(`<div class="flabel">Móvil · 390 × 844</div>
    <div class="phone" data-frame><div class="screen"><div class="island"></div><iframe src="${c.path}" title="${c.name} móvil" loading="lazy" tabindex="-1"></iframe></div>
    <div class="phone-bar"><button data-reload>↻ Reiniciar</button><button data-live>▶ Interactuar</button></div></div>`, x, Y_LOW);
  add(`<div class="insp-title" style="margin-bottom:20px">Inspiración en <em>Mobbin</em></div>
    <div class="insp">${c.insp.map(s => `<a href="${M(s[3])}" target="_blank" rel="noopener" data-link class="ref"><span class="initial" aria-hidden="true">${s[1].replace(/[^A-Za-z0-9+]/g, '').slice(0, 2)}</span><div class="cap"><b>${s[1]} ↗</b><span>${s[2]}</span></div><i>Ver en Mobbin</i></a>`).join('')}</div>`, x + 450, Y_LOW - 50);
});
const WORLD = { x: -60, y: -80, w: COL * 4 - 140, h: 2500 };

/* ---------- Favorite ---------- */
function paintFav() {
  document.querySelectorAll('[data-fav]').forEach(b => {
    const on = b.dataset.fav === fav;
    b.classList.toggle('on', on); b.textContent = on ? '★ Mi favorito' : '☆ Me gusta este';
    b.closest('.head').classList.toggle('picked', on);
  });
  document.getElementById('favLabel').textContent = fav === null ? 'Sin favorito aún' : '★ Favorito: ' + concepts[+fav].name;
}
paintFav();

/* ---------- Camera ---------- */
const cam = { x: 0, y: 0, z: .2 }, zl = document.getElementById('zl');
function apply() {
  world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.z})`;
  const g = 28 * cam.z;
  vp.style.backgroundSize = `${g}px ${g}px`; vp.style.backgroundPosition = `${cam.x}px ${cam.y}px`;
  zl.textContent = Math.round(cam.z * 100) + '%';
}
const clampZ = z => Math.min(2, Math.max(.05, z));
function zoomAt(sx, sy, nz) { nz = clampZ(nz); const wx = (sx - cam.x) / cam.z, wy = (sy - cam.y) / cam.z; cam.z = nz; cam.x = sx - wx * nz; cam.y = sy - wy * nz; apply(); }
let raf;
function flyToRect(r, pad = 70) {
  cancelAnimationFrame(raf);
  const W = innerWidth, H = innerHeight - 70;
  const z = clampZ(Math.min((W - pad * 2) / r.w, (H - pad * 2) / r.h));
  const to = { z, x: W / 2 - (r.x + r.w / 2) * z, y: 56 + H / 2 - (r.y + r.h / 2) * z - 28 };
  const from = { ...cam }, t0 = performance.now(), dur = 900;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    // interpolate in log-zoom space so long flights feel even
    cam.z = Math.exp(Math.log(from.z) + (Math.log(to.z) - Math.log(from.z)) * e);
    const fcx = (innerWidth / 2 - from.x) / from.z, fcy = (innerHeight / 2 - from.y) / from.z;
    const tcx = (innerWidth / 2 - to.x) / to.z, tcy = (innerHeight / 2 - to.y) / to.z;
    cam.x = innerWidth / 2 - (fcx + (tcx - fcx) * e) * cam.z; cam.y = innerHeight / 2 - (fcy + (tcy - fcy) * e) * cam.z;
    apply(); if (k < 1) raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
const rects = {
  all: WORLD,
  'row-desk': { x: -40, y: Y_DESK - 60, w: COL * 4 - 160, h: 1000 },
  'row-mob': { x: -40, y: Y_LOW - 90, w: COL * 4 - 160, h: 1010 },
};
concepts.forEach((c, i) => rects[i] = { x: i * COL - 30, y: -60, w: 1500, h: 2440 });
document.getElementById('toolbar').addEventListener('click', e => {
  const b = e.target.closest('[data-fit]'); if (!b) return;
  document.querySelectorAll('[data-fit]').forEach(x => x.classList.toggle('on', x === b));
  flyToRect(rects[b.dataset.fit]);
});
document.getElementById('zi').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, cam.z * 1.25);
document.getElementById('zo').onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, cam.z / 1.25);
zl.onclick = () => zoomAt(innerWidth / 2, innerHeight / 2, 1);

vp.addEventListener('wheel', e => {
  e.preventDefault(); cancelAnimationFrame(raf);
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, cam.z * Math.exp(-e.deltaY * .01));
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; apply(); }
}, { passive: false });

/* ---------- Pan (clicks on buttons/links still work if pointer barely moved) ---------- */
let pan = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  cancelAnimationFrame(raf);
  pan = { x: e.clientX, y: e.clientY, moved: 0 };
  vp.setPointerCapture(e.pointerId); vp.classList.add('panning');
});
vp.addEventListener('pointermove', e => {
  if (!pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  pan.moved += Math.abs(dx) + Math.abs(dy); pan.x = e.clientX; pan.y = e.clientY;
  cam.x += dx; cam.y += dy; apply();
});
const endPan = e => {
  if (!pan) return;
  const wasClick = pan.moved < 5; pan = null; vp.classList.remove('panning');
  // pointer capture retargets the click to #vp, so resolve links manually
  if (wasClick && e.type === 'pointerup') {
    const link = document.elementsFromPoint(e.clientX, e.clientY).find(el => el.closest && el.closest('a'));
    if (link) window.open(link.closest('a').href, '_blank', 'noopener');
  }
};
vp.addEventListener('pointerup', endPan); vp.addEventListener('pointercancel', endPan);
world.addEventListener('click', e => { if (e.target.closest('a')) e.preventDefault(); });

/* ---------- Frame actions ---------- */
function setLive(frame, on) {
  document.querySelectorAll('[data-frame].live').forEach(f => { if (f !== frame) { f.classList.remove('live'); f.querySelector('[data-live]').classList.remove('on'); f.querySelector('[data-live]').textContent = '▶ Interactuar'; } });
  frame.classList.toggle('live', on);
  const b = frame.querySelector('[data-live]'); b.classList.toggle('on', on); b.textContent = on ? '■ Salir (Esc)' : '▶ Interactuar';
}
world.addEventListener('click', e => {
  const fb = e.target.closest('[data-fav]');
  if (fb) { fav = fav === fb.dataset.fav ? null : fb.dataset.fav; try { fav === null ? localStorage.removeItem('portafolio-fav') : localStorage.setItem('portafolio-fav', fav); } catch (err) {} paintFav(); return; }
  const frame = e.target.closest('[data-frame]'); if (!frame) return;
  if (e.target.closest('[data-reload]')) { const f = frame.querySelector('iframe'); f.src = f.src; }
  if (e.target.closest('[data-live]')) setLive(frame, !frame.classList.contains('live'));
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('[data-frame].live').forEach(f => setLive(f, false)); });

addEventListener('resize', apply);
apply();
requestAnimationFrame(() => { const r = WORLD, z = Math.min((innerWidth - 140) / r.w, (innerHeight - 210) / r.h); cam.z = z * .7; cam.x = innerWidth / 2 - (r.x + r.w / 2) * cam.z; cam.y = innerHeight / 2 - (r.y + r.h / 2) * cam.z; apply(); flyToRect(WORLD); });
</script>
</body>
</html>
